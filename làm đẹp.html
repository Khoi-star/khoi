<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Menu Chức Năng</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Poppins:wght@400;600&display=swap');

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Poppins', sans-serif;
        }

        body {
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            background: linear-gradient(135deg, #1a1a1a, #333);
            overflow: hidden;
            position: relative;
        }

        .menu-container {
            text-align: center;
            background: rgba(255, 255, 255, 0.1);
            padding: 30px;
            border-radius: 15px;
            box-shadow: 0 0 20px rgba(255, 0, 0, 0.8);
            border: 2px solid rgba(255, 0, 0, 0.5);
            backdrop-filter: blur(10px);
            z-index: 2;
            position: relative;
        }

        h1 {
            font-size: 26px;
            font-weight: 600;
            color: white;
            text-shadow: 2px 2px 10px rgba(255, 0, 0, 0.8);
        }

        .menu, .submenu {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 15px;
            margin-top: 20px;
        }

        button {
            width: 220px;
            padding: 12px;
            font-size: 18px;
            cursor: pointer;
            border: none;
            color: white;
            background-color: rgba(255, 255, 255, 0.2);
            border-radius: 5px;
            transition: 0.3s;
            text-align: center;
            font-weight: 600;
            border: 2px solid rgba(255, 255, 255, 0.5);
        }

        button:hover {
            background-color: rgba(255, 0, 0, 0.8);
            color: white;
            border-color: rgba(255, 0, 0, 1);
            box-shadow: 0 0 15px rgba(255, 0, 0, 0.8);
        }

        .submenu button.active {
            background-color: #ff0000;
            color: white;
            border-color: #ff0000;
            box-shadow: 0 0 15px rgba(255, 0, 0, 0.8);
        }

        #result {
            margin-top: 20px;
            font-size: 20px;
            font-weight: bold;
            color: white;
            text-shadow: 2px 2px 10px rgba(255, 0, 0, 0.8);
        }

        .hidden {
            display: none;
        }

        /* 🔥 Hiệu ứng lửa rơi */
        .fire {
            position: absolute;
            top: -50px;
            font-size: 24px;
            color: red;
            animation: fall linear infinite;
        }

        @keyframes fall {
            0% { transform: translateY(-50px) rotate(0deg); opacity: 1; }
            100% { transform: translateY(100vh) rotate(360deg); opacity: 0; }
        }

        /* 💡 Hiệu ứng glow nền */
        .glow {
            position: absolute;
            width: 100px;
            height: 100px;
            background: rgba(255, 0, 0, 0.3);
            filter: blur(80px);
            animation: glowMove 5s infinite alternate ease-in-out;
        }

        @keyframes glowMove {
            0% { transform: translate(-50px, -50px); }
            100% { transform: translate(50px, 50px); }
        }

        /* ✨ Made by Khanhaim */
        .made-by {
            margin-top: 15px;
            font-size: 16px;
            color: white;
            text-shadow: 0 0 10px rgba(255, 0, 0, 1);
            font-weight: bold;
            animation: glowText 1.5s infinite alternate;
        }

        @keyframes glowText {
            0% { text-shadow: 0 0 10px rgba(255, 0, 0, 1); }
            100% { text-shadow: 0 0 20px rgba(255, 0, 0, 1); }
        }

    </style>
</head>
<body>

    <!-- Hiệu ứng glow nền -->
    <div class="glow" style="top: 10%; left: 10%;"></div>
    <div class="glow" style="top: 80%; right: 10%;"></div>

    <div class="menu-container">
        <h1>Menu Chức Năng</h1>
        
        <!-- Menu Chính -->
        <div class="menu" id="mainMenu">
            <button onclick="showSubMenu()">Chọn Chức Năng</button>
            <button onclick="thoat()">Exit</button>
        </div>

        <!-- Menu Chức Năng -->
        <div class="submenu hidden" id="submenu">
            <button onclick="chonChucNang(this, 'Aimlock')">Aimlock</button>
            <button onclick="chonChucNang(this, 'Nhẹ Tâm')">Nhẹ Tâm</button>
            <button onclick="chonChucNang(this, 'Tăng Nhạy')">Tăng Nhạy</button>
        </div>

        <p id="result"></p>

        <!-- Made by Khanhaim -->
        <p class="made-by">🔥 Made by Khanhaim 🔥</p>
    </div>

    <script>
        function showSubMenu() {
            document.getElementById("mainMenu").classList.add("hidden");
            document.getElementById("submenu").classList.remove("hidden");
        }

        function chonChucNang(button, chucNang) {
            // Toggle trạng thái chọn
            button.classList.toggle("active");

            // Lấy danh sách các chức năng đã chọn
            let selected = [];
            document.querySelectorAll(".submenu button.active").forEach(btn => {
                selected.push(btn.textContent);
            });

            // Hiển thị kết quả
            document.getElementById("result").innerText = "Bạn đã chọn: " + (selected.length ? selected.join(", ") : "Không có chức năng nào");
        }

        function thoat() {
            document.getElementById("result").innerText = "Bạn đã thoát!";
        }

        // 🔥 Tạo hiệu ứng lửa rơi
        function createFire() {
            const fire = document.createElement("div");
            fire.classList.add("fire");
            fire.innerText = "🔥";

            // Vị trí ngẫu nhiên
            fire.style.left = Math.random() * window.innerWidth + "px";
            fire.style.animationDuration = (Math.random() * 3 + 2) + "s"; // Tốc độ rơi ngẫu nhiên

            document.body.appendChild(fire);

            // Xoá icon sau khi rơi xuống
            setTimeout(() => {
                fire.remove();
            }, 5000);
        }

        // Tạo lửa liên tục
        setInterval(createFire, 300);
    </script>

</body>
</html>
